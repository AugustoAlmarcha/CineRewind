<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Degradé característico CineRewind -->
    <linearGradient id="crGradClaqueta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Resplandor sutil rubí -->
    <filter id="crGlowClaqueta" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#F43F5E" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#crGlowClaqueta)">
    <!-- Cuerpo inferior de la claqueta -->
    <rect x="6" y="34" width="88" height="58" rx="14" fill="#14151b" stroke="url(#crGradClaqueta)" stroke-width="2.5"/>

    <!-- Tapa diagonal de la claqueta en degradé libre -->
    <path d="M 6 18 L 94 6 L 94 30 L 6 38 Z" fill="url(#crGradClaqueta)"/>
    
    <!-- Rayas características de corte -->
    <line x1="28" y1="15" x2="33" y2="34" stroke="#14151b" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="52" y1="12" x2="57" y2="31" stroke="#14151b" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="74" y1="9" x2="79" y2="28" stroke="#14151b" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Flechas Rewind centrales libres -->
    <path d="M 46 48 L 26 63 L 46 78 Z" fill="url(#crGradClaqueta)"/>
    <path d="M 68 48 L 48 63 L 68 78 Z" fill="url(#crGradClaqueta)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Degradé característico CineRewind -->
    <linearGradient id="crGradTicket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Resplandor exterior de silueta -->
    <filter id="crGlowTicket" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#F43F5E" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#crGlowTicket)">
    <!-- Silueta ancha del boleto (ocupa todo el ancho, libre sin caja exterior) -->
    <path d="M 6 22 
             C 6 14, 14 6, 22 6 
             L 42 6 
             C 42 16, 50 24, 58 24 
             C 66 24, 74 16, 74 6 
             L 78 6 
             C 86 6, 94 14, 94 22 
             L 94 78 
             C 94 86, 86 94, 78 94 
             L 74 94 
             C 74 84, 66 76, 58 76 
             C 50 76, 42 84, 42 94 
             L 22 94 
             C 14 94, 6 86, 6 78 Z" 
          fill="#14151b" 
          stroke="url(#crGradTicket)" 
          stroke-width="2.5"/>

    <!-- Línea punteada de corte vertical -->
    <line x1="58" y1="26" x2="58" y2="74" stroke="url(#crGradTicket)" stroke-width="2" stroke-dasharray="4 4" opacity="0.85"/>

    <!-- Flechas Rewind a la izquierda -->
    <path d="M 38 37 L 22 50 L 38 63 Z" fill="url(#crGradTicket)"/>
    <path d="M 52 37 L 36 50 L 52 63 Z" fill="url(#crGradTicket)"/>

    <!-- Puntos perforados en la solapa derecha -->
    <circle cx="76" cy="38" r="3" fill="#F43F5E"/>
    <circle cx="76" cy="50" r="3" fill="#FB923C"/>
    <circle cx="76" cy="62" r="3" fill="#F43F5E"/>
  </g>
</svg>
